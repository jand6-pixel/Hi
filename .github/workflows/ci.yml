name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify repository
        run: |
          echo "CI workflow is configured."
          git rev-parse --short HEAD
          git status --short
          ls -la
